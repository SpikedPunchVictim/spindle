[workspace]
resolver = "2"
members = [
    "crates/*",
    # "spikes/*" — spike crates are added explicitly as they are created, not via glob.
    # A bare glob here would break the workspace as soon as spikes/README.md (a non-crate
    # directory entry) exists without a Cargo.toml — cargo errors on a glob match with no
    # manifest, it does not skip it. Spike crates (docs/DESIGN.md A13) are listed here by
    # hand as they're added:
    "spikes/s3-throughput",
    "spikes/s11-vfs-confinement",
    "spikes/s1-callout",
    "spikes/s19-quic-transport",
    "spikes/s5-presence",
    "spikes/s2-signaling",
]
# apps/*/src-tauri join this workspace once the Tauri apps are initialized (IMPLEMENTATION_PLAN
# Stage 7), e.g. "apps/host/src-tauri", "apps/client/src-tauri".

[workspace.package]
version = "0.1.0"
edition = "2021"
# license = "TBD (A10.24)"

# Dependency pins below are documented per ADR-009 (docs/DESIGN.md §A9c dependency manifest);
# crates adopt them (add to their own [dependencies] via `workspace = true`) as implementation
# begins. Versions are conservative requirements, not verified exact releases — this repo was
# scaffolded on a machine with no cargo installed, so none of these have been resolved or built.
[workspace.dependencies]
# Runtime
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"

# NATS
async-nats = "0.35"

# WebRTC (DESIGN.md A9c: webrtc >=0.20; datachannel-rs is the S3 fallback if it fails)
webrtc = ">=0.20"

# Crypto
ed25519-dalek = "2"
x25519-dalek = "2"
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.8"
subtle = "2"
zeroize = "1"

# Encoding
minicbor = "0.24"

# Storage
# rusqlite pinned to 0.32 (not the newest release, currently 0.40) so its `libsqlite3-sys`
# requirement (^0.30.1) unifies with what `sqlx-sqlite` requires elsewhere in this workspace's
# dependency graph. `sqlx`'s own Cargo.toml lists `sqlx-sqlite` (and `sqlx-mysql`) as optional
# dependencies unconditionally, and even though nothing in this workspace enables sqlx's "sqlite"
# feature (so `sqlx-sqlite` is never actually compiled — confirmed via `cargo tree -i
# libsqlite3-sys`, which shows only rusqlite depending on it), Cargo's `links = "sqlite3"`
# uniqueness check still runs against the full manifest-declared graph when resolving the
# workspace-wide Cargo.lock (the spikes/ crates pull in spindle-helper -> sqlx too, which is what
# brings `sqlx-sqlite` into that full-graph resolution). Verified empirically, not from memory:
# bumping rusqlite to 0.40 (`libsqlite3-sys ^0.38.0`) makes `cargo check --workspace` fail with
# "failed to select a version for `libsqlite3-sys`" citing exactly this `links` conflict against
# `sqlx-sqlite`; 0.32 is the newest rusqlite release whose requirement range still overlaps
# sqlx-sqlite 0.8.x's `^0.30.1` (rusqlite 0.33 bumps to `^0.31.0`, which no longer overlaps).
# Re-check this pin (`cargo tree -i libsqlite3-sys` after bumping) whenever sqlx or rusqlite is
# next upgraded, or if any workspace member ever enables sqlx's "sqlite" feature for real.
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio"] }

# Confinement
cap-std = ">=3.4.1"
# `cap-fs-ext` is the same-repo (bytecodealliance/cap-std) companion crate that exposes
# `OpenOptionsMaybeDirExt::maybe_dir` — needed by spindle-vfs's `stat_through_dir`/
# `resolve_identity` so opening a directory-through-`Dir` handle works on Windows (plain `open`
# never sets `FILE_FLAG_BACKUP_SEMANTICS` there, so it fails for directories; see
# crates/spindle-vfs/src/confine/identity.rs doc comments). Pinned to the same `4.0.3` release as
# the resolved cap-std/cap-primitives (its own Cargo.toml requires an exact-matching
# cap-primitives version internally) so the three stay in lockstep in the same 4.x family.
cap-fs-ext = ">=4.0.3"

# OS / shell
keyring = "2"

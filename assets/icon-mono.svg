<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Spindle">
  <!-- Monochrome variant of the Spindle icon: same geometry, single currentColor,
       transparent background. Since a filled cocoon can't show contrast wrap
       lines on an unknown background, this draws the cocoon as an outline and
       the wrap lines as strokes inside it (an outline-style mono mark). -->

  <!-- Shaft above the cocoon -->
  <line x1="128" y1="40" x2="128" y2="80" stroke="currentColor" stroke-opacity="0.9" stroke-width="7" stroke-linecap="round"/>

  <!-- Cocoon: outline only (no fill), so wrap lines stay legible on any background -->
  <path d="M128,78 C150,88 164,108 164,130 C164,152 150,172 128,182 C106,172 92,152 92,130 C92,108 106,88 128,78 Z"
        fill="none" stroke="currentColor" stroke-width="4"/>

  <!-- Wrap lines on the cocoon -->
  <path d="M99,100 Q128,110 157,100" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
  <path d="M94,118 Q128,128 162,118" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
  <path d="M94,136 Q128,146 162,136" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
  <path d="M97,154 Q128,163 159,154" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>

  <!-- Shaft below the cocoon, tapering to a point -->
  <path d="M125,182 L131,182 C131,182 129.5,194 128,200 C126.5,194 125,182 125,182 Z"
        fill="currentColor" fill-opacity="0.9"/>

  <!-- Whorl -->
  <ellipse cx="128" cy="202" rx="20" ry="6.5" fill="currentColor" fill-opacity="1"/>

  <!-- Loose thread escaping the cocoon toward the upper right -->
  <path d="M131,80 C142,64 162,58 180,60 C198,62 208,50 210,38"
        fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
</svg>

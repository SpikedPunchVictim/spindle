<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Spindle">
  <!-- Spindle project icon: a drop spindle (shaft + wound thread + whorl) with a
       thread splitting into two peer nodes, evoking peer-to-peer file sharing. -->

  <defs>
    <!-- Badge background: deep indigo (top) to violet (bottom) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square badge -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bgGrad)"/>

  <!-- Spindle shaft: rounded top, tapering to a point that meets the whorl -->
  <path d="M122,90
           C122,86 124.7,83 128,83
           C131.3,83 134,86 134,90
           L133,178
           C133,178 130.5,190 128,193
           C125.5,190 123,178 123,178
           Z"
        fill="#ffffff" fill-opacity="0.92"/>

  <!-- Whorl disc near the bottom of the shaft -->
  <ellipse cx="128" cy="194" rx="26" ry="9" fill="#ffffff" fill-opacity="1"/>

  <!-- Thread wound around the shaft's middle: gentle wrap arcs -->
  <path d="M118,108 Q128,113 138,108" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M117,124 Q128,130 139,124" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M117,140 Q128,146 139,140" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M118,156 Q128,161 138,156" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Thread rising from the shaft top, splitting into two peer connections -->
  <path d="M128,83 L128,60" fill="none" stroke="#ffffff" stroke-opacity="1" stroke-width="8" stroke-linecap="round"/>
  <path d="M128,60 C110,54 92,50 76,50" fill="none" stroke="#ffffff" stroke-opacity="1" stroke-width="8" stroke-linecap="round"/>
  <path d="M128,60 C146,54 164,50 180,50" fill="none" stroke="#ffffff" stroke-opacity="1" stroke-width="8" stroke-linecap="round"/>

  <!-- Peer nodes -->
  <circle cx="76" cy="50" r="11" fill="#ffffff" fill-opacity="1"/>
  <circle cx="180" cy="50" r="11" fill="#ffffff" fill-opacity="1"/>
</svg>

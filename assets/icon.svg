<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Spindle">
  <!-- Spindle project icon: a spindle shaft through a solid wound-thread cocoon,
       with a loose thread escaping toward the upper right. -->

  <defs>
    <!-- Badge background: deep indigo (top) to violet (bottom) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square badge -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bgGrad)"/>

  <!-- Shaft above the cocoon -->
  <line x1="128" y1="40" x2="128" y2="80" stroke="#ffffff" stroke-opacity="0.9" stroke-width="7" stroke-linecap="round"/>

  <!-- Cocoon: solid wound-thread bundle -->
  <path d="M128,78 C150,88 164,108 164,130 C164,152 150,172 128,182 C106,172 92,152 92,130 C92,108 106,88 128,78 Z"
        fill="#ffffff" fill-opacity="0.95"/>

  <!-- Wrap lines on the cocoon -->
  <path d="M99,100 Q128,110 157,100" fill="none" stroke="#312e81" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
  <path d="M94,118 Q128,128 162,118" fill="none" stroke="#312e81" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
  <path d="M94,136 Q128,146 162,136" fill="none" stroke="#312e81" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
  <path d="M97,154 Q128,163 159,154" fill="none" stroke="#312e81" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>

  <!-- Shaft below the cocoon, tapering to a point -->
  <path d="M125,182 L131,182 C131,182 129.5,194 128,200 C126.5,194 125,182 125,182 Z"
        fill="#ffffff" fill-opacity="0.9"/>

  <!-- Whorl -->
  <ellipse cx="128" cy="202" rx="20" ry="6.5" fill="#ffffff" fill-opacity="1"/>

  <!-- Loose thread escaping the cocoon toward the upper right -->
  <path d="M131,80 C142,64 162,58 180,60 C198,62 208,50 210,38"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
</svg>

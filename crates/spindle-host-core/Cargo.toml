[package]
name = "spindle-host-core"
version.workspace = true
edition.workspace = true

# Crate layering law (A9c boundary rule 3 / DESIGN.md §A9c: proto ← core ← {net, vfs} ← host-core):
# Stage 6 slice 3 gives this crate its first real dependencies. `spindle-vfs` (and transitively
# `spindle-core`, `spindle-proto`) supplies the shares/groups/entitlements engine, the entitlement
# algebra, path confinement, SQLite persistence, and the audit chain this slice's `VfsRpcServer`
# is built on. `spindle-proto` supplies the VFS RPC wire types directly (not just transitively via
# `spindle-vfs`, which does not depend on `spindle-proto` for wire concerns) — the server decodes
# `VfsRequestEnvelope`/encodes `VfsReply` itself. `cap-std` is taken directly (not just through
# `spindle-vfs`) because the server holds a `cap_std::fs::Dir` value per request, obtained from
# `spindle_vfs::confine::open_share_root`, to perform the actual `read`/`list` I/O. `thiserror`
# matches every other library crate in this workspace.
#
# Stage 6 slice 5 adds `spindle-net` (the layering law explicitly allows host-core -> net) for
# `serve.rs`'s binding loop: it reads/writes `spindle_net::framing` frames off a real QUIC control
# stream and calls straight into this crate's own `VfsRpcServer::handle_bytes` — no new wire
# dependency beyond `spindle-net` itself, since the frame payloads are still this crate's own
# canonical-CBOR bytes. `tokio` is new here too: `serve_control_stream` is `async fn`, generic over
# any `tokio::io::{AsyncRead, AsyncWrite}` half (not tied to QUIC specifically — see that
# function's doc comment).
[dependencies]
spindle-core = { path = "../spindle-core" }
spindle-proto = { path = "../spindle-proto" }
spindle-vfs = { path = "../spindle-vfs" }
spindle-net = { path = "../spindle-net" }
cap-std = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# `rustix`/`windows-sys` back `limits::OsFreeSpace` (DESIGN.md §A4b free-space floor; user decision
# 2026-08-26 — A9c manifest amended). Both are already-transitive dependencies of this crate via
# `cap-std`/`cap-primitives` (verified via `cargo tree -i rustix` / `cargo tree --target all -i
# windows-sys`) — this promotes them to direct, target-scoped deps rather than reaching through
# `cap-std`'s private dependency graph. Crate-local (not workspace-level), matching the `tempfile`
# precedent below: this pin is specific to this crate's OS probe, not shared workspace policy.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# 0.60 already resolves to the locked 0.60.2 (the version cap-std's Windows path already pulls in
# via cap-primitives/io-extras — confirmed with `cargo tree --target all -i windows-sys@0.60.2`).
# `Win32_Storage_FileSystem` is the only feature needed: it gates the `FileSystem` module
# (`GetDiskFreeSpaceExW`) and implies `Win32_Storage`; `BOOL`/`PCWSTR` live in the always-available
# `windows_sys::core` module, so no `Win32_Foundation` feature is required.
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }

# tempfile is crate-local only (not a workspace dependency), matching the precedent set by
# `spindle-vfs`'s own `Cargo.toml`: negative/integration tests need disposable real temp
# directories to run confinement/RPC pipeline tests against; this never becomes a runtime
# dependency of spindle-host-core.
[dev-dependencies]
tempfile = "3"

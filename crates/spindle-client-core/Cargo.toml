[package]
name = "spindle-client-core"
version.workspace = true
edition.workspace = true

# Crate layering law (A9c boundary rule 3): the client library sits above `spindle-core` and
# `spindle-proto`. `self_revocation` deliberately takes no `async-nats` dependency: its
# `RevokeTransport` trait is the seam the app's authenticated NATS client implements, which keeps
# this crate runtime-neutral and lets its tests run with no broker. serde/serde_json are pinned
# crate-locally (matching spindle-helper's pins — neither is a workspace dependency) because the
# helper's `helper.revoke.<nfp>` reply is JSON.
[dependencies]
spindle-proto = { path = "../spindle-proto" }
spindle-core = { path = "../spindle-core" }
# VFS RPC client transport (td-6e3e90): the length-prefixed control-stream framing and, in tests,
# the QUIC client. The crate itself only names the framing/io types, not quinn.
spindle-net = { path = "../spindle-net" }
tokio = { workspace = true }
# Device CONNECT (td-7c80c5): build the callout-authenticated NATS connection and the session nkey.
async-nats = { workspace = true }
nkeys = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# `tests/live_self_revocation.rs` (td-a06afc) needs the shared callout-bootstrap fixtures and
# `connect_device`, so the test authenticates through the real NATS Auth Callout instead of
# re-implementing the CONNECT envelope; `async-nats` is the live member connection the test-local
# `RevokeTransport` adapter drives (the production adapter lands with the app, not in this
# crate); `rand` supplies the per-run `OsRng` seeds the module doc explains are load-bearing
# against the helper's durable revoked set. `nkeys` mints the second connection's fresh session
# key exactly as `spindle-net/tests/live_signaling.rs`'s revoked-reconnect probe does. All four
# are test-only: the library itself stays runtime-neutral (see `[dependencies]` above).
spindle-test-fixtures = { path = "../spindle-test-fixtures" }
# The VFS client integration test runs the real host-core serve loop, store, and QUIC pair.
spindle-host-core = { path = "../spindle-host-core" }
spindle-vfs = { path = "../spindle-vfs" }
tempfile = "3"
x25519-dalek = { workspace = true }
async-nats = { workspace = true }
rand = { workspace = true }
nkeys = "0.4"

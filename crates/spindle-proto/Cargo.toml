[package]
name = "spindle-proto"
version.workspace = true
edition.workspace = true

# Zero dependencies, by design — not just "no crypto dependency" (A9c boundary rule 3), but no
# dependencies at all. The canonical CBOR codec (src/canonical.rs) is hand-rolled rather than
# built on the workspace's `minicbor` pin (see src/canonical.rs and src/lib.rs doc comments for
# why), and `gen-vectors`'s JSON vector writer (src/bin/gen_vectors.rs) is a small hand-rolled
# writer for the same reason: this crate sits at the bottom of the dependency chain
# (proto ← core ← {net, vfs} ← {host-core, client-core}) and stays that way for both its library
# and its bin target.
[dependencies]

# `gen-vectors` writes the golden CBOR vectors consumed by both this crate's tests and
# @spindle/proto's tests in CI (docs/DESIGN.md A9b, A9c; see ADR-009 once written).
[[bin]]
name = "gen-vectors"
path = "src/bin/gen_vectors.rs"

[package]
name = "spindle-vfs"
version.workspace = true
edition.workspace = true

# Crate layering law (A9c boundary rule 3 / DESIGN.md §A9c): spindle-vfs depends on spindle-core
# (and transitively spindle-proto) plus cap-std for path confinement. Stage 6 slice 2 adds
# rusqlite (bundled, per the A9c dependency manifest: "rusqlite (bundled) host-side") for the
# `store` and `audit` modules — still no tokio/async: rusqlite is synchronous, and this crate
# stays a plain library with no runtime. No other new dependency: the audit chain's hashing reuses
# `spindle_core::Fingerprint::of_parts` (SHA-256) and its head-signing reuses
# `spindle_core::{sign_bytes, verify_bytes}` rather than taking a direct `ed25519-dalek`/`sha2`
# dependency of its own (see `crate::audit` module docs). td-47d24d (USER DECISION 2026-09-04)
# adds `unicode-normalization` for `confine::fold::fold_key`'s NFD folding, replacing a hand-
# rolled 27-entry Latin-1 table that stripped accents instead of normalizing them. td-6c9d95 step 2
# adds `tracing` — already a workspace dependency (root `Cargo.toml`) and already sanctioned by the
# A9c manifest (DESIGN.md:814); `spindle-net` sets the house style this crate's call sites follow.
# This crate stays a library: it must never call `tracing_subscriber` or install a global
# subscriber — see `src/lib.rs`'s doc comment.
[dependencies]
spindle-core = { path = "../spindle-core" }
cap-std = { workspace = true }
cap-fs-ext = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
unicode-normalization = { workspace = true }
tracing = { workspace = true }

# `std::os::windows::fs::MetadataExt::{volume_serial_number,file_index,number_of_links}` are
# gated behind the nightly-only `windows_by_handle` feature (rust-lang/rust#63010) — unusable on
# stable Rust, which is why this code never actually compiled on a real Windows toolchain before.
# `same-file` (stable, via `GetFileInformationByHandle`) gives equivalent file-identity semantics;
# `winapi-util` (the crate `same-file` itself uses internally for that same WinAPI call) gives the
# link count `nlink_guard` needs, which `same-file`'s public API does not expose. Both are
# Windows-only; the existing dev+ino/nlink path on Unix is untouched.
[target.'cfg(windows)'.dependencies]
same-file = "1"
winapi-util = "0.1"

# The first `[features]` section in this workspace (no other crate has one yet, so this sets the
# precedent). `test-support` exists for exactly one purpose: letting a downstream crate's own test
# code construct a `devices` row that this crate's real write paths structurally cannot produce
# (see `Store::set_device_alg_id_for_test`'s doc comment in `src/store/mod.rs` for the row shape
# and why). The feature is additive-only — it adds a method, it changes nothing else — and off by
# default, so a plain `cargo build`/`cargo check` of this crate or anything depending on it never
# sees it. It must never be turned on by a normal (non-dev) dependency edge: the workspace uses
# `resolver = "2"` (root `Cargo.toml:2`), which keeps a feature enabled only via a `[dev-dependencies]`
# edge from unifying into that dependent crate's own non-test builds, so as long as every consumer
# enables `test-support` from its `[dev-dependencies]` section (as `spindle-host-core`'s does), the
# feature can never reach a production binary. Anything gated behind this feature is test
# scaffolding: it deliberately performs no validation and exists to write rows a real caller
# cannot, so production code must never be able to reach it — that is what keeps this an addition
# to the A9c SQLite-ownership boundary (spindle-vfs owns all SQLite access) rather than a hole in
# it.
[features]
test-support = []

# tempfile is crate-local only (not a workspace dependency), matching the precedent set by the
# S11 spike (spikes/s11-vfs-confinement/Cargo.toml) it graduates from: confinement tests need a
# disposable sandbox directory tree; this never becomes a runtime dependency of spindle-vfs.
[dev-dependencies]
tempfile = "3"
# Same pinned workspace rusqlite, plus the `hooks` feature — enabled HERE (a dev-dependency of
# this one crate) rather than on the workspace dependency, so it applies only when test/bench
# targets are built. Under resolver = "2" (workspace root Cargo.toml) features enabled solely by
# a dev-dependency are not unified into `cargo build`/`cargo check` of the library itself, so no
# non-test consumer of spindle-vfs gains `hooks`. `hooks = []` in rusqlite 0.32.1's Cargo.toml is
# an empty feature (verified in the vendored source), so this pulls in no additional crates — it
# only un-gates `Connection::authorizer` (rusqlite src/hooks/mod.rs), which
# `store::tests::member_and_cap_epoch_never_returns_a_torn_member_epoch_pair_under_a_concurrent_revoke`
# uses to interleave a second connection's write at a deterministic point. It does NOT change the
# rusqlite version, so the 0.32 pin rationale in the workspace manifest is unaffected.
rusqlite = { workspace = true, features = ["hooks"] }

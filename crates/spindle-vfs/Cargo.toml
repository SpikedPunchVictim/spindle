[package]
name = "spindle-vfs"
version.workspace = true
edition.workspace = true

# Crate layering law (A9c boundary rule 3 / DESIGN.md §A9c): spindle-vfs depends on spindle-core
# (and transitively spindle-proto) plus cap-std for path confinement. Stage 6 slice 2 adds
# rusqlite (bundled, per the A9c dependency manifest: "rusqlite (bundled) host-side") for the
# `store` and `audit` modules — still no tokio/async: rusqlite is synchronous, and this crate
# stays a plain library with no runtime. No other new dependency: the audit chain's hashing reuses
# `spindle_core::Fingerprint::of_parts` (SHA-256) and its head-signing reuses
# `spindle_core::{sign_bytes, verify_bytes}` rather than taking a direct `ed25519-dalek`/`sha2`
# dependency of its own (see `crate::audit` module docs).
[dependencies]
spindle-core = { path = "../spindle-core" }
cap-std = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }

# `std::os::windows::fs::MetadataExt::{volume_serial_number,file_index,number_of_links}` are
# gated behind the nightly-only `windows_by_handle` feature (rust-lang/rust#63010) — unusable on
# stable Rust, which is why this code never actually compiled on a real Windows toolchain before.
# `same-file` (stable, via `GetFileInformationByHandle`) gives equivalent file-identity semantics;
# `winapi-util` (the crate `same-file` itself uses internally for that same WinAPI call) gives the
# link count `nlink_guard` needs, which `same-file`'s public API does not expose. Both are
# Windows-only; the existing dev+ino/nlink path on Unix is untouched.
[target.'cfg(windows)'.dependencies]
same-file = "1"
winapi-util = "0.1"

# tempfile is crate-local only (not a workspace dependency), matching the precedent set by the
# S11 spike (spikes/s11-vfs-confinement/Cargo.toml) it graduates from: confinement tests need a
# disposable sandbox directory tree; this never becomes a runtime dependency of spindle-vfs.
[dev-dependencies]
tempfile = "3"

[package]
name = "spindle-net"
version.workspace = true
edition.workspace = true

# Crate layering law (A9c boundary rule 3 / DESIGN.md §A9c: proto ← core ← {net, vfs} ← {host-core,
# client-core}): Stage 6 slice 5 gave this crate its first real dependencies, confined to the QUIC
# control-stream transport (DESIGN.md §A8/A10.32) graduated from spikes/s19-quic-transport. Stage 5
# slice 3 adds NATS-mediated signaling (DESIGN.md §A6/§A7), graduated from spikes/s2-signaling —
# both peer roles' offer/answer/trickle-ICE exchange, wired to the QUIC seam above. `spindle-proto`/
# `spindle-core` are taken directly per the layering law (this crate sits directly above `core`);
# `spindle-vfs`/`spindle-host-core`/`spindle-client-core` are deliberately NOT dependencies here
# (the layering law forbids `net` from depending on any of them — the direction is
# host-core/client-core -> net, not the reverse). This is why the host role's membership/
# authorization decision ("is this sender an active, non-revoked member device?", DESIGN.md §A5)
# is an injected trait (`signaling::ConnectAuthorizer`) rather than an inline registry lookup: that
# registry lives in `spindle-host-core`, which this crate must never depend on. The WebRTC
# data-channel transport (browser peers) and the client-side transfer manager remain future
# additions — see this crate's `lib.rs` module doc comment.
[dependencies]
spindle-core = { path = "../spindle-core" }
spindle-proto = { path = "../spindle-proto" }
thiserror = { workspace = true }
sha2 = { workspace = true } # cert fingerprint (SHA-256 of the DER) — same derivation as A10.32/S19
# One soft-failure case in `signaling::ice` (a malformed trickled candidate line, e.g. from a
# future peer's extension this agent doesn't parse yet) is worth an operator's attention without
# being fatal to the connect attempt (matching `spikes/s2-signaling`'s own warn-and-continue
# precedent) — `tracing` is this workspace's logging facade everywhere else, so this crate's first
# use of it follows the same convention rather than inventing its own.
tracing = { workspace = true }

tokio = { workspace = true } # workspace already declares features = ["full"]

# NATS-mediated signaling transport (DESIGN.md §A6): the caller owns/connects the client (see
# `signaling`'s module doc comment — "the NATS client is passed in, not owned" is a brief
# constraint, not this crate's default preference either way), this crate only publishes/
# subscribes on it.
async-nats = { workspace = true }
# `async_nats::Subscriber` is a `futures_core::Stream`; `StreamExt::next()` is the standard,
# minimal way to drive it in a `while let` loop (`signaling::host::SignalingHost::run`'s connect
# subscription, and `signaling::bridge_incoming_ice`'s per-session trickle-ICE subscription).
# `spindle-helper`'s own Cargo.toml carries the identical dependency for the identical reason —
# see that crate's manifest comment: this resolves to a version already present in the workspace's
# Cargo.lock (a transitive dep of async-nats/webrtc), so it adds no new dependency *version* to the
# tree, only a direct edge to an existing one. A plain version pin (not `{ workspace = true }`)
# matches `spindle-helper`'s own precedent, since `futures-util` is not in the root workspace
# manifest's `[workspace.dependencies]` table.
futures-util = "0.3"

# The A7 envelope's ephemeral X25519 keys (`derive_bootstrap_key`/`derive_session_key`'s `eph_dh`
# input) are typed as `x25519_dalek::PublicKey`/`StaticSecret` by `spindle_core::identity::DeviceKey`
# (`diffie_hellman`/`agree_public_key`), and `spindle-core` does not re-export that crate the way it
# re-exports `ed25519-dalek`'s `VerifyingKey`/`SigningKey` (see that crate's `lib.rs`) — so a caller
# of `DeviceKey::diffie_hellman` needs its own direct dependency to name the type at all. `signaling`
# is the first thing in this crate to call that API (`quic`/`framing` never touch envelope crypto).
x25519-dalek = { workspace = true }
# Session ids (16 random bytes per connect, DESIGN.md §A6) and ephemeral X25519 keypair generation
# (`StaticSecret::random_from_rng(OsRng)`) both need a CSPRNG source.
rand = { workspace = true }

# Standalone ICE punching (DESIGN.md §A8/A10.32), graduated from `spikes/s2-signaling`'s
# `s2-connect.rs` (itself built on `spikes/s19-quic-transport`'s leg 2) — see the root workspace
# manifest's `[workspace.dependencies]` entries for the why-`rtc-ice`-not-`webrtc-ice`/why-sans-I/O/
# why-`ring` rationale (condensed there rather than repeated per-crate).
rtc-ice = { workspace = true }
rtc-stun = { workspace = true }
rtc-shared = { workspace = true }
sansio = { workspace = true }
bytes = { workspace = true }

# Exact S19 recipe (spikes/s19-quic-transport/Cargo.toml), reused verbatim rather than
# re-litigated: `default-features = false` + `["runtime-tokio", "rustls-ring"]` keeps this crate's
# dep tree to the pure-Rust `ring` crypto provider only (no cmake, no C toolchain needed to
# `cargo build`) — quinn's default features pull in `platform-verifier` (irrelevant: this crate
# always uses a custom fingerprint-pinning verifier, never the platform trust store) and, via
# rustls's own defaults, `aws-lc-rs` (a cmake+C-toolchain build S19/S3 already document the pain
# of on this workspace's dev machines).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }

# Matches quinn's `rustls-ring` selection above: `default-features = false` + `["ring", "std"]`
# avoids also pulling in rustls's own default `aws-lc-rs` provider alongside `ring` (both would
# otherwise build). The custom `ServerCertVerifier`/`ClientCertVerifier` fingerprint-pinning
# verifiers (A10.32; mutual pinning is this slice's addition over S19's server-only pinning) live
# on the base `rustls::client::danger`/`rustls::server::danger` modules in 0.23 with no separate
# cargo feature gate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Self-signed per-session QUIC certificate (A10.32) — a fresh cert+key generated once per session
# by `quic::SessionCert`. **Not yet in the A9c dependency manifest** (DESIGN.md §A9c's table lists
# `quinn` for QUIC but no certificate-generation crate) — flagged in this slice's report as a
# documentation gap, not silently resolved; S19 already carries this exact dependency as
# spike-local precedent.
rcgen = "0.13"

# This crate's own unit tests (framing round-trip/split-read/oversize, quic mutual-pinning
# handshake, every `signaling::*` receiver check) need no test-only crate at all: they exercise
# `tokio` (already a normal dependency, `features = ["full"]` from the workspace pin includes
# `#[tokio::test]`), `quinn`, and `rustls` directly.
#
# `tests/live_signaling.rs`, the `#[ignore]`d live integration test that drives `signaling`
# against `deploy/docker-compose.yml`'s real NATS Auth Callout, needs the crates below.
# Bootstrapping a callout-authenticated connection is the only thing that needs them, and it is
# exactly the thing that cannot be faked without making the test's permission-scoping evidence
# vacuous.
[dev-dependencies]
# `tests/live_signaling.rs`'s own remaining code (outside the fixtures graduated below) still
# mints session nkeys directly (`assert_revoked_device_cannot_reconnect`, the S9 revocation test's
# domain-separated identity derivation): generates the per-connection session nkey (ed25519) each
# NATS CONNECT presents, and decodes an nkey-encoded public key back to its raw 32 bytes so the
# test can compute `nats_fp = hash(nats_pk)` (DESIGN.md §A4). Already in this workspace's
# Cargo.lock (`spindle-helper` and `spikes/s1-callout` carry the identical pin for the identical
# reason), so this adds no new dependency *version* to the tree.
nkeys = "0.4"
# The callout bootstrap fixtures (`mod fixtures`) and live-stack connection helpers
# (`connect_device`/`connect_host`/etc.) this file used to define locally were graduated into this
# shared crate so `spindle-hostd`'s own live test can reuse them verbatim instead of carrying a
# second, driftable copy — see that crate's docs for why (the 2026-08-31 incident this file's own
# module doc comment documents). `base64` (previously also a dev-dependency here, for the
# `auth_token`'s `URL_SAFE_NO_PAD` encoding) moved out along with the fixtures that used it: this
# file no longer uses it directly.
spindle-test-fixtures = { path = "../spindle-test-fixtures" }

# Reference nats-server config (docs/DESIGN.md §A3, §A4, §A9b) for the docker-compose dev/demo
# stack. Adapted from spikes/s1-callout/server.conf — the config S1 proved passes 19/19 automated
# checks against a live nats-server:2.10-alpine (spikes/s1-callout/RESULTS.md) — not invented
# fresh. Same shape (non-operator/config-based accounts, static `accounts {}`/`auth_callout {}`
# blocks), same dev-only caveats (no TLS, throwaway nkeys). Still not production-hardened: see
# deploy/README.md for what's deliberately deferred.

# Every CONNECT presents compact-CBOR capabilities (~200 B each, up to 32 per connection,
# DESIGN.md §A4/§A5). nats-server's default max_control_line (4 KiB) is too small — this sets it
# to 32 KiB so a full CONNECT (device cert + 32 caps) fits (A10.10).
max_control_line: 32768

# TCP listener for daemons (hosts/native clients). Server-cert TLS / optional mTLS with
# short-lived private-CA certs (A10.1) is the hardened profile — not configured here; see the
# dev-only note at the bottom of this file.
port: 4222

websocket {
  port: 8080
  # Dev-only: no TLS. Browsers require TLS on a real deployment's WebSocket listener; this stack
  # is loopback/docker-network-only. See the note at the bottom of this file.
  no_tls: true
}

# --- Account topology (DESIGN.md §A5 "Helper account bridging [DEFAULT]", ADR-002's topology
# table) --------------------------------------------------------------------------------------
# Two nkey identities the spindle-helper container authenticates as (docker-compose.yml's
# CALLOUT_USER_SEED / APP_CONN_SEED env vars), both exempted from the callout itself via
# `auth_callout.auth_users` below — S1's proven "two separate connections" bridging finding
# (spikes/s1-callout/RESULTS.md's "ADR-002's open topology question — answered"):
#   - CALLOUT_USER (AUTH account): the callout/system connection, answers $SYS.REQ.USER.AUTH.
#   - APP_CONN_USER (APP account): the application connection (idle in this slice; presence/TURN/
#     registry work lands in Stage 4 slice 3+ — see crates/spindle-helper/src/bin/helper.rs).
# The APP account's own nkey (`nkey: "AAJ...5A"`, matching APP_ACCOUNT_SEED below) is the
# account's signing identity — it signs every User JWT the callout responder issues, and is never
# itself used to open a connection (also proven by S1: an account-prefixed key, not a user-prefixed
# one, is what `AuthorizationResponseClaims.iss` requires — see
# crates/spindle-helper/src/natsjwt.rs's module docs).
accounts: {
  AUTH: {
    users: [
      { nkey: "UBOKLTYUN4EM5INIFGA2FCJ45UJXEDWMR6QJJBLOPPLO453D7B6ONTL6" } # CALLOUT_USER
    ]
  }
  APP: {
    nkey: "AAJLUJSOCTR5DWJ33NNRTZZMQFT475S523GVOHEVV4UMST5O65CXBK5A" # APP_ACCOUNT
    users: [
      { nkey: "UAOUJCRS3HXWQ2GKAA2PZA7QA5WQN3QTPTBSFX2KYC2XTY7P67U2252X" } # APP_CONN_USER
    ]
  }
  SYS: {
    users: []
  }
}

system_account: SYS

# Auth Callout: every other connection (host or client — anything not in `auth_users` below) is
# authorized dynamically by spindle-helper's callout responder, not by a static permissions
# block — DESIGN.md §A4/§A5.
authorization {
  auth_callout {
    issuer: "AAJLUJSOCTR5DWJ33NNRTZZMQFT475S523GVOHEVV4UMST5O65CXBK5A" # APP_ACCOUNT public key
    auth_users: [
      "UBOKLTYUN4EM5INIFGA2FCJ45UJXEDWMR6QJJBLOPPLO453D7B6ONTL6", # CALLOUT_USER
      "UAOUJCRS3HXWQ2GKAA2PZA7QA5WQN3QTPTBSFX2KYC2XTY7P67U2252X"  # APP_CONN_USER
    ]
    account: AUTH
  }
}

# NOTE (dev/local only): no `tls {}` block on the client/websocket listeners above — this stack
# runs unencrypted TCP/WS on a docker-compose bridge network for local iteration only. DESIGN.md/
# ADR-002's production topology assumes TLS in front of every listener (private CA, §A9b's
# secrets inventory); that hardening is out of scope for this slice (deploy/README.md).
#
# NOTE (dev/local only): the nkeys embedded above are throwaway, generated once for this file via
# `cargo run -p spike-s1-callout --bin genkeys` (a second `KeyPair::new_user()` call added
# temporarily for the third, APP_CONN_USER key, then reverted) and matched by docker-compose.yml's
# CALLOUT_USER_SEED/APP_ACCOUNT_SEED/APP_CONN_SEED env vars. Regenerate all of them together
# (this file's public keys AND docker-compose.yml's seeds) if either changes — never reuse this
# key material for anything beyond this local dev stack.

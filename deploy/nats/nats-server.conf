# Reference nats-server config (docs/DESIGN.md §A3, §A4, §A9c). This is a starting point for
# the docker-compose reference deployment (deploy/docker-compose.yml) — not production-hardened.

# Every CONNECT presents compact-CBOR capabilities (~200 B each, up to 32 per connection,
# A10.5/A10.10). nats-server's default max_control_line (4 KiB) is too small; the registry sets
# it to 32 KiB so a full CONNECT (device cert + 32 caps) fits.
max_control_line: 32768

# TCP listener for daemons; server-cert TLS. Optional mTLS with short-lived private-CA certs is
# the hardened profile (A10.1) — not configured by default here.
port: 4222

websocket {
  port: 443
  # TLS is required for the WebSocket listener in any non-local deployment; certs are supplied
  # out of band (not checked into this repo). See deploy/README.md.
  no_tls: true # dev-only default; set to false and configure `tls {}` for anything but localhost
}

# Auth Callout: every connection (host or client) is authorized by the broker helper, not by a
# static nats-server accounts file — there is no `authorization {}` / `accounts {}` block here
# because the callout responder (crates/spindle-helper) grants permissions dynamically per
# docs/DESIGN.md §A4/§A5. See ADR-002 (once written) for the full account topology
# (one application account + one system account, explicit export/import per subject).

# allowed_connection_types (WEBSOCKET for browsers, STANDARD for daemons) is set per-connection
# by the callout's JWT response, not statically here — see ADR-002.

# No JetStream in v1 (docs/DESIGN.md §A3: "core NATS; no JetStream in v1").

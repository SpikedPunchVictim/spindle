name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ADR-010: mise is the single toolchain front door on all 3 OSes, in CI as in
      # local dev. This provisions rustup/cargo per mise.toml; rustup then reads
      # rust-toolchain.toml for the exact pinned channel (ADR-009 stays authoritative).
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Ensure rustfmt/clippy components
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  ts:
    name: ts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ADR-010: mise is the single toolchain front door on all 3 OSes, in CI as in
      # local dev — provisions Node + pnpm per mise.toml (which mirrors .nvmrc and
      # the packageManager pin).
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        run: pnpm -r build

      - name: pnpm test
        run: pnpm -r test

  vectors:
    name: vector cross-check
    runs-on: ubuntu-latest
    needs: [rust, ts]
    steps:
      - uses: actions/checkout@v4

      # ADR-010: mise is the single toolchain front door on all 3 OSes, in CI as in
      # local dev. This provisions Rust (rustup/cargo per mise.toml) and Node + pnpm,
      # since this job runs both the Rust vector generator and the TS test suite.
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Regenerate golden vectors and verify they're byte-identical to committed vectors/
        run: |
          cargo run -p spindle-proto --bin gen-vectors
          cargo run -p spindle-core --bin gen-crypto-vectors
          git diff --exit-code vectors/

      - name: Cross-check @spindle/proto's TypeScript canonical CBOR encoder against vectors/
        run: pnpm --filter @spindle/proto test

  changes:
    name: detect toolchain changes
    runs-on: ubuntu-latest
    outputs:
      toolchain: ${{ steps.filter.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            toolchain:
              - 'Dockerfile.toolchain'
              - 'mise.toml'

  # ADR-010: one Dockerfile.toolchain covers the devcontainer and Linux CI image
  # validation. Only build it here when it (or the versions it installs from) change —
  # no push, this just proves the image still builds.
  toolchain-image:
    name: toolchain image build (validation only)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.toolchain == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: docker build -f Dockerfile.toolchain
        run: docker build -f Dockerfile.toolchain .

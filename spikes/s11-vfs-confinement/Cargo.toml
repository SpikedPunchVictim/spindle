[package]
name = "spike-s11-vfs-confinement"
version.workspace = true
edition.workspace = true
publish = false

# docs/DESIGN.md §A13: VFS confinement (cap-std) against the negative-test matrix in lib.rs.
[dependencies]
cap-std = { workspace = true }

# `std::os::windows::fs::MetadataExt::{volume_serial_number,file_index,number_of_links}` are
# gated behind the nightly-only `windows_by_handle` feature (rust-lang/rust#63010) — unusable on
# stable Rust, which is why this spike never actually compiled on a real Windows toolchain before.
# `same-file` (stable, via `GetFileInformationByHandle`) gives equivalent file-identity semantics;
# `winapi-util` (the crate `same-file` itself uses internally for that same WinAPI call) gives the
# link count `nlink_guard` needs, which `same-file`'s public API does not expose. Both are
# Windows-only; the existing dev+ino/nlink path on Unix is untouched.
[target.'cfg(windows)'.dependencies]
same-file = "1"
winapi-util = "0.1"

# tempfile is spike-local only (not a workspace dependency) — each test needs a disposable
# sandbox directory tree; nothing here becomes a runtime dependency of spindle-vfs later.
[dev-dependencies]
tempfile = "3"

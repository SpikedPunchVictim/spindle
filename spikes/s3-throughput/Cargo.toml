[package]
name = "spike-s3-throughput"
version.workspace = true
edition.workspace = true
publish = false

# Enabled to run S3 (docs/SPIKES.md §S3 / docs/DESIGN.md §A13): DataChannel throughput at
# 0/20/50/100 ms RTT, SCTP tuning. `bytes` and `async-trait` are declared locally (not
# workspace-pinned): `bytes` is only needed here for chunk buffers, and `async-trait` is required
# to implement webrtc's `PeerConnectionEventHandler` trait (its methods are async-trait-attributed
# in the crate itself, so implementors need the same macro — not re-exported by `webrtc`).
[[bin]]
name = "spike-s3-throughput"
path = "src/main.rs"

# `dc-throughput` (src/bin/dc-throughput.rs): the datachannel-rs fallback harness named in
# docs/DESIGN.md §A8 ("evaluate `datachannel-rs` if S3 fails") and invoked per RESULTS.md after
# the `webrtc`-backend binary above missed the 50 ms RTT bar. Same measurement protocol, callback
# (not async) API — see that file's module doc comment.
#
# Gated behind the `datachannel-backend` feature (see [dependencies] below): the `datachannel`
# crate's `vendored-libdatachannel` feature fails to LINK on macOS out of the box (`ld: library
# 'ssl' not found` against Homebrew's keg-only openssl@3), which broke `cargo build`/`cargo test
# --workspace` for everyone on this crate, not just people exercising the fallback backend.
# `required-features` here means a plain `cargo build -p spike-s3-throughput` (no `--bin`) skips
# this binary entirely — no cfg changes needed in dc-throughput.rs itself. To build/run it on
# macOS:
#   RUSTFLAGS="-L$(brew --prefix openssl@3)/lib" \
#     cargo build -p spike-s3-throughput --release --features datachannel-backend --bin dc-throughput
# (Linux, e.g. this crate's rtt-run.sh container, doesn't need the RUSTFLAGS override — libssl-dev
# puts the library in a standard search path there.)
[[bin]]
name = "dc-throughput"
path = "src/bin/dc-throughput.rs"
required-features = ["datachannel-backend"]

# `tcp-baseline` (src/bin/tcp-baseline.rs): follow-up environment baseline — is `tc netem`-shaped
# loopback itself capable of >= 15 MB/s @ 50 ms RTT over plain TCP, independent of either SCTP
# backend above? Deliberately std-only (no new dependencies) — see that file's module doc comment.
[[bin]]
name = "tcp-baseline"
path = "src/bin/tcp-baseline.rs"

# `browser-peer` (src/bin/browser-peer.rs): A10.29 — measure DataChannel throughput against a
# REAL Chrome peer (dcSCTP), not another `webrtc-rs`/`datachannel-rs` process. Runs a WebSocket
# signaling server (`tokio-tungstenite`) that `browser-peer.html` (opened directly via `file://`,
# no HTTP server) connects to; the Rust side is always the SDP offerer/data-channel creator, same
# `webrtc` 0.20.3 backend and CLI knobs (`--sctp-buf`/`--chunk`/`--bytes`/`--threshold`) as
# `src/main.rs`. See RESULTS.md's "Browser-peer (dcSCTP) measurement plan" section for exactly how
# to run it and what it measures — this is a harness only; A10.29's Chrome-driven measurements
# have not been taken yet (a later session drives Chrome).
[[bin]]
name = "browser-peer"
path = "src/bin/browser-peer.rs"

[dependencies]
webrtc = { workspace = true }
tokio = { workspace = true } # workspace already declares features = ["full"]
anyhow = { workspace = true }
bytes = "1"
async-trait = "0.1"

# WebSocket signaling for `browser-peer` (A10.29) — the lightest crates that give an async
# WebSocket accept/read/write loop on top of the existing `tokio` runtime. Deliberately NOT
# axum/hyper (a full HTTP server stack) per the task's dependency budget — `browser-peer.html` is
# opened via `file://` with no HTTP server involved at all, so all this binary needs is the raw
# WebSocket upgrade + frame handling `tokio-tungstenite` provides. `futures-util` is only needed
# for its `StreamExt`/`SinkExt` (`.next()`/`.send()`) on the split WebSocket stream.
tokio-tungstenite = "0.24"
futures-util = "0.3"

# JSON signaling messages (`browser-peer`) and JSON-lines stats samples (`browser-peer` +
# `src/main.rs`, `--stats-out`) — both already resolve transitively in this workspace's dependency
# tree (`webrtc`'s own stats types derive `serde::{Serialize,Deserialize}`; `serde_json` is
# already in `Cargo.lock` via another transitive dependency), so declaring them directly here adds
# no new crates to the build, just a direct (rather than incidental) dependency. `serde` is the
# only realistic way to correctly encode/decode SDP text (embedded `\r\n`, potential quotes) as
# JSON string values without hand-rolling an escaper — see `src/bin/browser-peer.rs`'s module doc
# comment.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Diagnostic-only: `webrtc` 0.20.3's SCTP layer (the `rtc-sctp` crate) logs its congestion-control
# internals (cwnd, a_rwnd, SACK send/receive, T3-rtx) via the `log` facade — see its
# `src/association/mod.rs` (module target `rtc_sctp::association`). `env_logger` is the standard,
# zero-config way to route those `log` records to stderr under `RUST_LOG` (e.g.
# `RUST_LOG=rtc_sctp=trace`); `browser-peer`'s own diagnostics still go through plain `eprintln!`
# elsewhere in this file, this only turns on the dependency-crate logging that was previously
# silently dropped (no global logger was ever installed).
env_logger = "0.11"

# datachannel-rs (libdatachannel bindings) — S3's designated fallback backend (docs/DESIGN.md
# §A8), used only by src/bin/dc-throughput.rs; the `webrtc`-backend src/main.rs above is
# untouched. `vendored-libdatachannel` builds libdatachannel itself from source via cmake (a C++
# toolchain is required at build time) but links dynamically against a system OpenSSL, rather than
# also vendoring+building OpenSSL from source (the plain `vendored` feature) — this host already
# has OpenSSL via Homebrew, so the lighter feature is the right pick. See RESULTS.md for the
# `brew install cmake` build hurdle this pulled in.
#
# `optional = true`, gated behind the `datachannel-backend` feature (NOT default; see [features]
# below): unconditionally depending on this made `vendored-libdatachannel`'s C++/cmake build a
# hard requirement for every `cargo build`/`cargo test --workspace` on this workspace, and on
# macOS the final link step fails outright (`ld: library 'ssl' not found`, against Homebrew's
# keg-only openssl@3) unless RUSTFLAGS points at it — see the [[bin]] dc-throughput comment above
# for the exact command, and RESULTS.md's "datachannel-rs backend" section for the full writeup.
datachannel = { version = "0.16", features = ["vendored-libdatachannel"], optional = true }

[features]
# Not default: see the `datachannel` dependency comment above for why. `cargo test --workspace`,
# `cargo build -p spike-s3-throughput`, and clippy with default features all skip this dependency
# and the dc-throughput binary entirely unless this feature is explicitly requested.
datachannel-backend = ["dep:datachannel"]

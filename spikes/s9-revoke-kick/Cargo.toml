[package]
name = "spike-s9-revoke-kick"
version.workspace = true
edition.workspace = true
publish = false

# S9 (docs/DESIGN.md §A4): revocation kicks live connections via `$SYS.REQ.SERVER.<id>.KICK
# {id: cid}`. This crate is a PARTIAL, throwaway spike — its only job is to settle the KICK
# mechanics (subject form, payload field name, reply shape, and proof that a reply actually
# corresponds to the connection dropping) against the live composed reference deployment
# (deploy/docker-compose.yml). It is not the full S9 revoke->kick->reject timing run (later work)
# and, like spikes/s5-presence, it talks to the *actual* nats-server/helper containers over the
# same NATS port a real daemon would use, rather than standing up its own throwaway server. See
# RESULTS.md for the full method and the verbatim captured evidence.
[dependencies]
tokio = { workspace = true }
async-nats = { workspace = true }
anyhow = { workspace = true }
serde_json = "1"
futures-util = "0.3"
